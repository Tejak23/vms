<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab Iconics VMS</title>
<style>
:root{--header:#384D44;--menu:#62835F;--thead:#405945;--side:#DAD7CF;--sub:#A8B390;--text:#222B26;--border:#CFCBC2;--ok:#2E7D32;--warn:#B26A00;--bad:#B3261E;--info:#1565C0}
*{box-sizing:border-box}body{margin:0;font:14px "Open Sans",Segoe UI,Arial,sans-serif;color:var(--text);background:#fff}
header{height:52px;background:var(--header);color:#fff;display:flex;align-items:center;padding:0 16px;gap:12px;position:fixed;inset:0 0 auto 0;z-index:5}
header b{font-size:18px;letter-spacing:1px}header .sp{flex:1}header span{font-size:12px}header button{background:none;border:1px solid #fff5;color:#fff;border-radius:4px;padding:4px 10px;cursor:pointer}
#app{display:flex;padding-top:52px;height:100vh}nav{width:285px;background:var(--side);overflow:auto;flex-shrink:0}
nav .mod{background:var(--header);color:#fff;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;border-left:4px solid transparent}nav .mod.on{background:var(--menu);border-left-color:#E8832A}
nav .it{padding:10px 14px 10px 26px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid #0000000d}nav .it:hover{background:#cbc8bf}nav .it.sel{background:var(--sub)}nav .ch{padding-left:44px;font-size:13px}
main{flex:1;overflow:auto;padding:20px 24px}h1{margin:0 0 14px;font-size:25px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}input,select,textarea{padding:8px;border:1px solid var(--border);border-radius:4px;font:inherit;max-width:100%}.bar input{flex:1;min-width:170px}
button.b{background:var(--menu);color:#fff;border:0;border-radius:4px;padding:8px 14px;cursor:pointer}button.s{background:#eee;color:#333;border:1px solid var(--border);border-radius:4px;padding:5px 9px;cursor:pointer;margin:1px}button:disabled{opacity:.5}
.tabs button{border:0;padding:9px 16px;cursor:pointer;background:#e8e6df}.tabs button.on{background:var(--menu);color:#fff}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{background:var(--thead);color:#fff;text-align:left;padding:10px;cursor:pointer;white-space:nowrap}td{padding:9px;border-bottom:1px solid var(--border);vertical-align:top}tr:nth-child(even) td{background:#f7f6f2}
.st{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap;background:#78807a}.st.Approved,.st.Active,.st.Passed,.st.Pass,.st.Closed{background:var(--ok)}.st.In,.st.Under,.st.Pending{background:var(--warn)}.st.Failed,.st.Fail,.st.Open,.st.Obsolete,.st.Inactive,.st.Blocked,.st.Runner,.st.Returned{background:var(--bad)}.st.Corrected{background:var(--info)}
.empty,.msg{padding:28px;text-align:center;color:#666}.err{color:var(--bad)}.ok{color:var(--ok)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}.modal>div{background:#fff;border-radius:6px;padding:20px;width:min(640px,95vw);max-height:92vh;overflow:auto}
.f label{display:block;margin:10px 0 4px;font-weight:600}.f input:not([type=checkbox]),.f textarea,.f select{width:100%}
#login{max-width:360px;margin:10vh auto;padding:24px;border:1px solid var(--border);border-radius:6px}#login input{width:100%;margin:6px 0}
.pg{display:flex;gap:8px;align-items:center;margin-top:12px}dl{display:grid;grid-template-columns:200px 1fr;gap:6px 12px}dt{font-weight:600}dd{margin:0;white-space:pre-wrap}
@media(max-width:800px){nav{width:210px}}
</style></head><body><div id="root"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A={tok:localStorage.tok||'',meta:null,cur:localStorage.cur||'home',open:localStorage.open||'Administration',L:{q:'',status:'',sort:'updated_at',desc:true,page:1}};
const LOAD='<div class=msg>Loading…</div>',can=p=>A.meta.me.perms.includes(p)||A.meta.me.perms.includes('admin');
async function api(p,o={}){const r=await fetch('/api/'+p,{method:o.method||'GET',headers:{'Content-Type':'application/json',Authorization:A.tok},body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(r.status==401&&A.tok&&p!='login'){A.tok='';localStorage.removeItem('tok');login('Session expired. Please sign in again.');throw new Error('Session expired')}if(!r.ok)throw new Error(typeof d.detail=='string'?d.detail:'Request failed');return d}
const modal=h=>{closeM();const m=document.createElement('div');m.className='modal';m.id='m';m.innerHTML='<div>'+h+'</div>';document.body.appendChild(m)},closeM=()=>$('#m')?.remove(),sb=t=>`<span class="st ${esc(String(t||'Draft').split(' ')[0])}">${esc(t||'Pending')}</span>`;
async function boot(){const s=await fetch('/api/status').then(r=>r.json());if(s.setup)return setup();if(!A.tok)return login();try{A.meta=await api('meta')}catch{return login()}shell();go(A.cur)}
function setup(){$('#root').innerHTML=`<div id=login><h2>First-time setup</h2><p>Create the administrator account for this system.</p><input id=n placeholder="Full name"><input id=u placeholder=Username><input id=p type=password placeholder="Password (min 8 characters)"><button class=b onclick=doSetup()>Create administrator</button><p id=e class=err></p></div>`}
async function doSetup(){try{await api('setup',{method:'POST',body:{name:$('#n').value,username:$('#u').value,password:$('#p').value}});login('Administrator created. Please sign in.')}catch(e){$('#e').textContent=e.message}}
function login(msg=''){$('#root').innerHTML=`<div id=login><h2>Lab Iconics VMS</h2><input id=u placeholder=Username><input id=p type=password placeholder=Password onkeydown="if(event.key=='Enter')doLogin()"><button class=b onclick=doLogin()>Sign in</button><p id=e class=err>${esc(msg)}</p></div>`}
async function doLogin(){try{const d=await api('login',{method:'POST',body:{username:$('#u').value,password:$('#p').value}});A.tok=d.token;localStorage.tok=d.token;boot()}catch(e){$('#e').textContent=e.message}}
async function logout(){try{await api('logout',{method:'POST'})}catch{}A.tok='';localStorage.removeItem('tok');login()}
function shell(){const m=A.meta.me;$('#root').innerHTML=`<header><b>LAB ICONICS VMS</b><small>v2.0</small><div class=sp></div><span>${esc(m.name)} | ${esc(m.usertype_name)}</span><button onclick="go('home')">Dashboard</button><button onclick=logout()>Logout</button></header><div id=app><nav id=nav></nav><main id=main></main></div>`;nav()}
function nav(){const mods=A.meta.menu.filter(m=>m.module!='Administration'||can('admin'));$('#nav').innerHTML=mods.map(m=>`<div class="mod ${A.open==m.module?'on':''}" onclick="tog('${m.module}')"><span>${m.module}</span><span>${A.open==m.module?'⌄':'›'}</span></div>`+(A.open==m.module?m.items.map(i=>i.children?`<div class=it onclick="this.nextSibling.hidden=!this.nextSibling.hidden"><span>${i.label}</span>›</div><div ${i.children.some(c=>c.key==A.cur)?'':'hidden'}>${i.children.map(c=>`<div class="it ch ${A.cur==c.key?'sel':''}" onclick="go('${c.key}')">${c.label}</div>`).join('')}</div>`:`<div class="it ${A.cur==i.key?'sel':''}" onclick="go('${i.key}')">${i.label}</div>`).join(''):'')).join('')}
function tog(m){A.open=A.open==m?'':m;localStorage.open=A.open;nav()}
const labelOf=k=>{for(const m of A.meta.menu)for(const i of m.items)for(const c of i.children||[i])if(c.key==k)return c.label;return'Dashboard'};
function go(k){A.cur=k;localStorage.cur=k;A.L={q:'',status:'',sort:'updated_at',desc:true,page:1};for(const m of A.meta.menu)for(const i of m.items)for(const c of i.children||[i])if(c.key==k&&A.open!=m.module){A.open=m.module;localStorage.open=m.module}nav();
({home:dash,'manual-execution':()=>runsView('Manual'),'automation-execution':()=>runsView('Automated'),'review-approval':reviewView,'deviation-log':devView,'re-execution':reexView,'document-report':()=>repView(['documents','executions','approvals'])}[k]||(k.startsWith('rep-')?()=>repView([k.slice(4)]):()=>A.meta.res[k].single?singleView(k):listView(k)))()}
const err=e=>$('#main').innerHTML=`<div class="msg err">${esc(e.message)}</div>`;
// ---------- dialogs
async function act(title,o,cb){let rc=[],rm=[];try{[rc,rm]=await Promise.all([api('r/reason-codes/options'),api('r/default-remarks/options')])}catch{}
modal(`<h3>${title}</h3><div class=f>${o.comment?`<label>Reason code</label><select id=rc><option value="">--</option>${rc.map(x=>`<option>${esc(x.title)}</option>`).join('')}</select><label>Default remark</label><select id=rm onchange="$('#cm').value=this.value"><option value="">--</option>${rm.map(x=>`<option>${esc(x.title)}</option>`).join('')}</select><label>Comment${o.req?' *':''}</label><textarea id=cm rows=3></textarea>`:''}${o.pw?`<label>E-signature: re-enter your password *</label><input id=pw type=password>`:''}</div><p id=e class=err></p><button class=b onclick="actGo()">Confirm</button> <button class=s onclick=closeM()>Cancel</button>`);window.actGo=async()=>{try{const rcv=$('#rc')?.value,c=($('#cm')?.value||'').trim();await cb(rcv&&c?rcv+': '+c:rcv||c,$('#pw')?.value||'');closeM()}catch(e){$('#e').textContent=e.message}}}
// ---------- generic forms
function inp(f,v,opts){const id='f_'+f.n;let h;
if(f.t=='a')h=`<textarea id=${id} rows=4>${esc(v||'')}</textarea>`;
else if(f.t=='s')h=`<select id=${id}><option value="">-- select --</option>${f.o.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
else if(f.t=='r')h=`<select id=${id}><option value="">-- select --</option>${(opts[f.o]||[]).map(x=>`<option value=${x.id} ${x.id==v?'selected':''}>${esc(x.label)}</option>`).join('')}</select>`;
else if(f.t=='m'){const l=typeof f.o=='string'?(opts[f.o]||[]).map(x=>[x.id,x.label]):f.o.map(x=>[x,x]);h=l.map(([k,t])=>`<label style="font-weight:400"><input type=checkbox class="m_${f.n}" value="${esc(k)}" ${(v||[]).map(String).includes(String(k))?'checked':''}> ${esc(t)}</label>`).join('<br>')||'<i>No options available</i>'}
else h=`<input id=${id} type=${f.t=='p'?'password':f.t=='n'?'number':f.t=='d'?'date':'text'} value="${f.t=='p'?'':esc(v??'')}">`;
return `<label>${esc(f.l)}${f.req?' *':''}</label>${h}`}
function collect(fs){const o={};for(const f of fs){if(f.t=='m')o[f.n]=[...document.querySelectorAll('.m_'+f.n+':checked')].map(x=>typeof f.o=='string'?+x.value:x.value);else{let v=$('#f_'+f.n).value;o[f.n]=v===''?null:(f.t=='r'||f.t=='n')?+v:v}}return o}
async function loadOpts(fs){const o={};await Promise.all(fs.filter(f=>(f.t=='r'||f.t=='m')&&typeof f.o=='string').map(async f=>o[f.o]=await api(`r/${f.o}/options`)));return o}
async function formModal(key,id,after){const fs=await api(`r/${key}/fields`),rec=id?await api(`r/${key}/${id}`):{data:{}},opts=await loadOpts(fs);
modal(`<h3>${id?'Edit':'New'} ${esc(A.meta.res[key].label)}</h3><div class=f>${fs.map(f=>inp(f,rec.data[f.n],opts)).join('')}</div><p id=e class=err></p><button class=b onclick="saveForm('${key}',${id||0})">Save</button> <button class=s onclick=closeM()>Cancel</button>`);window._fs=fs;window._after=after;
if(key=='document-creation')$('#f_template').onchange=async function(){if(!this.value)return;const t=await api('r/document-template/'+this.value),c=$('#f_content');if(!c.value.trim())c.value=(t.data.body||'').replace(/{{title}}/g,$('#f_title').value||'').replace(/{{project}}/g,$('#f_project').selectedOptions[0]?.text||'')}}
async function saveForm(key,id){try{await api(id?`r/${key}/${id}`:`r/${key}`,{method:id?'PUT':'POST',body:collect(window._fs)});closeM();(window._after||(()=>go(key)))()}catch(e){$('#e').textContent=e.message}}
async function viewModal(key,id){const [fs,r]=await Promise.all([api(`r/${key}/fields`),api(`r/${key}/${id}`)]);modal(`<h3>${esc(r.code)} ${sb(r.status)} v${r.version}</h3><dl>${fs.filter(f=>f.t!='p').map(f=>`<dt>${esc(f.l)}</dt><dd>${esc(r.disp[f.n]||r.data[f.n]||'')}</dd>`).join('')}<dt>Created by</dt><dd>${esc(r.created_by)}</dd><dt>Note</dt><dd>${esc(r.note)}</dd></dl><button class=s onclick=closeM()>Close</button>`)}
async function histModal(key,id){const h=await api(`r/${key}/${id}/history`);modal(`<h3>Record history</h3><div class=tw><table><tr><th>Time<th>User<th>Action<th>Detail</tr>${h.audit.map(a=>`<tr><td>${a.ts}<td>${esc(a.user)}<td>${esc(a.action)}<td>${esc(a.detail)}</tr>`).join('')}</table></div><h4>Electronic signatures</h4>${h.signatures.map(s=>`<p>${esc(s.user)} – ${esc(s.meaning)} – ${s.ts}<br><small>record hash ${s.rec_hash.slice(0,16)}…</small></p>`).join('')||'<p class=empty>None</p>'}<button class=s onclick=closeM()>Close</button>`)}
// ---------- list view
async function listView(key){const S=A.meta.res[key],M=$('#main'),L=A.L;M.innerHTML=LOAD;try{const [fs,d]=await Promise.all([api(`r/${key}/fields`),api(`r/${key}?q=${encodeURIComponent(L.q)}&status=${L.status}&sort=${L.sort}&desc=${L.desc}&page=${L.page}`)]);const n=Math.ceil(d.total/10)||1,cols=fs.filter(f=>!['a','p'].includes(f.t)).slice(0,4),sts=S.wf?['Draft','In Review','Approved','Obsolete']:['Active','Inactive'];
M.innerHTML=`<h1>${esc(S.label)}${can(S.perm)?`<button class=b onclick="formModal('${key}',0)">+ New</button>`:''}</h1><div class=bar><input id=q placeholder="Enter Search Param" value="${esc(L.q)}" onkeydown="if(event.key=='Enter'){A.L.q=this.value;A.L.page=1;listView('${key}')}"><select onchange="A.L.status=this.value;A.L.page=1;listView('${key}')"><option value="">All statuses</option>${sts.map(s=>`<option ${L.status==s?'selected':''}>${s}</option>`).join('')}</select><button class=s onclick="A.L.desc=!A.L.desc;listView('${key}')">${L.desc?'Z-A':'A-Z'}</button><button class=s onclick="A.L={q:'',status:'',sort:'updated_at',desc:true,page:1};listView('${key}')">Reset</button></div>
<div class=tw><table><tr><th onclick="srt('${key}','code')">ID<th>${cols.map(f=>esc(f.l.split(':')[0].slice(0,28))).join('<th>')}<th onclick="srt('${key}','status')">Status<th>Actions</tr>${d.items.map(r=>`<tr><td>${esc(r.code)}${S.wf?' v'+r.version:''}<td>${cols.map(f=>esc(r.disp[f.n]||r.data[f.n]||'')).join('<td>')}<td>${sb(r.status)}${r.note?`<br><small>${esc(r.note)}</small>`:''}<td>${racts(key,r,S)}</tr>`).join('')}</table></div>${d.items.length?'':'<div class=empty>No records found.</div>'}<div class=pg><button class=s ${L.page<2?'disabled':''} onclick="A.L.page--;listView('${key}')">Prev</button>Page ${L.page} of ${n} (${d.total})<button class=s ${L.page>=n?'disabled':''} onclick="A.L.page++;listView('${key}')">Next</button></div>`}catch(e){err(e)}}
const srt=(k,s)=>{A.L.sort=s;A.L.desc=!A.L.desc;listView(k)};
function racts(key,r,S){let h=`<button class=s onclick="viewModal('${key}',${r.id})">View</button><button class=s onclick="histModal('${key}',${r.id})">History</button>`;const w=can(S.perm);
if(S.wf){if(w&&r.status=='Draft')h+=`<button class=s onclick="formModal('${key}',${r.id})">Edit</button><button class=s onclick="stat('${key}',${r.id},'In Review')">Submit</button>`;if(r.status=='In Review'&&can('approve'))h+=`<button class=s onclick="stat('${key}',${r.id},'Approved')">Approve</button>`;if(r.status=='In Review'&&(can('review')||can('approve')))h+=`<button class=s onclick="stat('${key}',${r.id},'Draft')">Return</button>`;if(r.status=='Approved'&&w)h+=`<button class=s onclick="revise('${key}',${r.id})">Revise</button>`;if(r.status=='Approved'&&can('approve'))h+=`<button class=s onclick="stat('${key}',${r.id},'Obsolete')">Obsolete</button>`}
else if(w){if(r.status=='Active')h+=`<button class=s onclick="formModal('${key}',${r.id})">Edit</button><button class=s onclick="stat('${key}',${r.id},'Inactive')">Deactivate</button>`;else h+=`<button class=s onclick="stat('${key}',${r.id},'Active')">Reactivate</button>`}return h}
function stat(key,id,to,done){const pw=['Approved','Obsolete'].includes(to),cm=['Draft','Inactive','Obsolete'].includes(to)||pw;act(`${to}`,{comment:1,req:['Draft','Inactive'].includes(to),pw},async(c,p)=>{await api(`r/${key}/${id}/status`,{method:'POST',body:{to,comment:c,password:p}});(done||(()=>go(A.cur)))()})}
async function revise(key,id){try{await api(`r/${key}/${id}/revise`,{method:'POST'});go(key)}catch(e){alert(e.message)}}
async function singleView(key){const M=$('#main'),S=A.meta.res[key];M.innerHTML=LOAD;try{const [fs,d]=await Promise.all([api(`r/${key}/fields`),api(`r/${key}`)]),rec=d.items[0];window._fs=fs;const opts=await loadOpts(fs);
M.innerHTML=`<h1>${esc(S.label)}</h1><div class=f style="max-width:560px">${fs.map(f=>inp(f,rec?rec.data[f.n]:'',opts)).join('')}</div><p id=e class=err></p><button class=b onclick="saveSingle('${key}',${rec?rec.id:0})">Save</button>${key=='email-config'?` <button class=s onclick="mailTest()">Send test email</button>`:''} ${rec?`<button class=s onclick="histModal('${key}',${rec.id})">History</button>`:''}`}catch(e){err(e)}}
async function saveSingle(key,id){try{await api(id?`r/${key}/${id}`:`r/${key}`,{method:id?'PUT':'POST',body:collect(window._fs)});$('#e').className='ok';$('#e').textContent='Saved'}catch(e){$('#e').className='err';$('#e').textContent=e.message}}
function mailTest(){const to=prompt('Send test email to:');if(to)api('email-test',{method:'POST',body:{to}}).then(()=>alert('Test email sent')).catch(e=>alert(e.message))}
// ---------- dashboard & review
async function dash(){const M=$('#main');M.innerHTML=LOAD;try{const q=await api('x/queue'),ret=q.records.filter(x=>x.status=='Draft'),pend=q.records.filter(x=>x.status!='Draft');A.tab=A.tab||'All';const rows=A.tab=='All'?[...pend.map(x=>[x.label,x.code+' – '+x.title,x.by,x.at,'In Review',x.key]),...q.runs.map(x=>['Execution',x.code+' – '+x.tc_title,x.executor,x.completed,'Pending Review','review-approval'])]:ret.map(x=>[x.label,x.code+' – '+x.title,x.by,x.at,'Returned',x.key]);
M.innerHTML=`<h1>Dashboard</h1><div style="background:#e8e6df;padding:12px;font-weight:700">APPROVAL TRANSACTIONS</div><div class=tabs><button class="${A.tab=='All'?'on':''}" onclick="A.tab='All';dash()">All ${pend.length+q.runs.length}</button><button class="${A.tab=='Returned'?'on':''}" onclick="A.tab='Returned';dash()">Returned ${ret.length}</button></div><div class=tw><table><tr><th>Menu Name<th>Name/ID<th>Action By<th>Action On<th>Approval Status</tr>${rows.map(r=>`<tr style=cursor:pointer onclick="go('${r[5]}')"><td>${esc(r[0])}<td>${esc(r[1])}<td>${esc(r[2])}<td>${esc(r[3])}<td>${sb(r[4])}</tr>`).join('')}</table></div>${rows.length?'':'<div class=empty>Nothing pending.</div>'}`}catch(e){err(e)}}
async function reviewView(){const M=$('#main');M.innerHTML=LOAD;try{const q=await api('x/queue'),rec=q.records.filter(x=>x.status!='Draft');
M.innerHTML=`<h1>${labelOf('review-approval')}</h1><h3>Records awaiting review/approval</h3><div class=tw><table><tr><th>Type<th>ID<th>Title<th>Submitted by<th>Updated<th>Actions</tr>${rec.map(x=>`<tr><td>${x.label}<td>${x.code}<td>${esc(x.title)}<td>${esc(x.by)}<td>${x.at}<td><button class=s onclick="viewModal('${x.key}',${x.id})">View</button><button class=s onclick="stat('${x.key}',${x.id},'Approved',reviewView)">Approve</button><button class=s onclick="stat('${x.key}',${x.id},'Draft',reviewView)">Return</button></tr>`).join('')}</table></div>${rec.length?'':'<div class=empty>No records awaiting review.</div>'}
<h3>Execution runs awaiting review</h3><div class=tw><table><tr><th>Run<th>Test case<th>Mode<th>Executor<th>Outcome<th>Actions</tr>${q.runs.map(x=>`<tr><td>${x.code}<td>${esc(x.tc)} ${esc(x.tc_title)}<td>${x.mode}<td>${esc(x.executor)}<td>${sb(x.status)}<td><button class=s onclick="openRun(${x.id})">Open</button><button class=s onclick="showReport(${x.id})">Report</button><button class=s onclick="revRun(${x.id},'Approved')">Approve</button><button class=s onclick="revRun(${x.id},'Returned')">Return</button></tr>`).join('')}</table></div>${q.runs.length?'':'<div class=empty>No runs awaiting review.</div>'}`}catch(e){err(e)}}
const revRun=(id,to)=>act(to+' run',{comment:1,req:to=='Returned',pw:to=='Approved'},async(c,p)=>{await api(`x/runs/${id}/review`,{method:'POST',body:{to,comment:c,password:p}});reviewView()});
// ---------- runs
async function runsView(mode,filter){const M=$('#main');M.innerHTML=LOAD;try{let r=(await api('x/runs')).filter(x=>x.mode==mode);
M.innerHTML=`<h1>${labelOf(A.cur)}${can('execute')?`<button class=b onclick="newRun('${mode}')">+ ${mode=='Manual'?'Start run':'Initiate automated run'}</button>`:''}</h1><div class=tw><table><tr><th>Run<th>Test case<th>Executor<th>Status<th>Review<th>Started<th>Retest of<th>Actions</tr>${r.map(x=>`<tr><td>${x.code}<td>${esc(x.tc)} – ${esc(x.tc_title)}<td>${esc(x.executor)}<td>${sb(x.status)}${x.message?`<br><small class=err>${esc(x.message)}</small>`:''}<td>${x.review?sb(x.review):''}<td>${x.started}<td>${x.retest_of||''}<td><button class=s onclick="openRun(${x.id})">Open</button><button class=s onclick="showReport(${x.id})">Report</button></tr>`).join('')}</table></div>${r.length?'':'<div class=empty>No runs yet. Approve a test case, then start a run.</div>'}`}catch(e){err(e)}}
async function newRun(mode){try{const [tc,pr,cf]=await Promise.all([api('r/test-cases/options'),api('r/projects/options'),mode=='Automated'?api('r/automation-config/options'):[]]);modal(`<h3>${mode=='Manual'?'Start manual run':'Initiate automated run'}</h3><div class=f><label>Approved test case *</label><select id=tc>${tc.map(x=>`<option value=${x.id}>${esc(x.label)}</option>`).join('')}</select><label>Project</label><select id=pj><option value="">--</option>${pr.map(x=>`<option value=${x.id}>${esc(x.label)}</option>`).join('')}</select>${mode=='Automated'?`<label>Automation configuration *</label><select id=cf>${cf.map(x=>`<option value=${x.id}>${esc(x.label)}</option>`).join('')}</select><p><small>The configured runner is contacted for real. If it is unreachable the run shows "Runner Error" and nothing is simulated.</small></p>`:''}</div><p id=e class=err>${tc.length?'':'No approved test cases available.'}</p><button class=b onclick="doRun('${mode}')">Start</button> <button class=s onclick=closeM()>Cancel</button>`)}catch(e){alert(e.message)}}
async function doRun(mode,tc,ro,cf,pj){try{const d=await api('x/runs',{method:'POST',body:{mode,tc_id:+(tc||$('#tc').value),retest_of:ro||null,config_id:cf||($('#cf')?+$('#cf').value:null),project_id:pj||($('#pj')?.value?+$('#pj').value:null)}});closeM();if(d.message)alert('Run created but: '+d.message);openRun(d.id)}catch(e){$('#e')?$('#e').textContent=e.message:alert(e.message)}}
async function openRun(id){const M=$('#main');try{const d=await api('x/runs/'+id),r=d.run,ip=r.status=='In Progress'&&r.mode=='Manual'&&r.executor==A.meta.me.username;
M.innerHTML=`<h1>${r.code} ${sb(r.status)} ${r.review?sb(r.review):''}<button class=s onclick="go(A.cur)">Back</button></h1><p>${esc(r.tc)} – ${esc(r.tc_title)} | ${r.mode} | Executor: ${esc(r.executor)}${r.retest_of?' | Re-execution of run '+r.retest_of:''}${r.review_note?'<br>Review note: '+esc(r.review_note):''}${r.message?`<br><b class=err>${esc(r.message)}</b>`:''}</p><div class=tw><table><tr><th>#<th>Instruction<th>Expected<th>Result / Actual${d.retests.length?'<th>Re-executions':''}</tr>${d.steps.map(s=>`<tr><td>${s.n}<td>${esc(s.instruction)}${s.ev_req?' <b>[E]</b>':''}<td>${esc(s.expected)}<td>${s.result?`${sb(s.result)}<br>${esc(s.actual)}<br><i>${esc(s.comment)}</i>${s.ev_file?`<br><a href=# onclick="dl(${s.id},'${esc(s.ev_name)}');return false">📎 ${esc(s.ev_name)}</a>`:''}<br><small>${esc(s.done_by)} ${s.ts}</small>`:ip?`<select id=r${s.id}><option>Pass<option>Fail<option>Blocked<option>Not Applicable</select><br><textarea id=a${s.id} rows=2 placeholder="Actual result" style="width:100%"></textarea><input id=c${s.id} placeholder="Comment / justification" style="width:100%"><input type=file id=f${s.id}><br><button class=s onclick="recStep(${s.id},${id})">Save step</button>`:'Not executed'}${d.retests.length?'<td>'+d.retests.map(t=>t.run.code+': '+sb(t.steps[s.n])).join('<br>'):''}</tr>`).join('')}</table></div>${d.deviations.length?`<h3>Deviations</h3>${d.deviations.map(x=>`<p>${x.code} ${sb(x.status)} ${esc(x.title)}</p>`).join('')}`:''}${ip?`<button class=b onclick="finish(${id})">Complete run</button> `:''}<button class=s onclick="showReport(${id})">Report</button>`}catch(e){err(e)}}
async function recStep(sid,rid){const f=$('#f'+sid).files[0];let b64='';if(f){if(f.size>5e6)return alert('File larger than 5 MB');b64=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)})}try{await api(`x/steps/${sid}/result`,{method:'POST',body:{result:$('#r'+sid).value,actual:$('#a'+sid).value,comment:$('#c'+sid).value,file_name:f?f.name:'',file_b64:b64}});openRun(rid)}catch(e){alert(e.message)}}
const finish=async id=>{try{await api(`x/runs/${id}/complete`,{method:'POST'});openRun(id)}catch(e){alert(e.message)}};
async function dl(sid,n){const r=await fetch('/api/x/evidence/'+sid,{headers:{Authorization:A.tok}});if(!r.ok)return alert('Download failed');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=n;a.click()}
async function showReport(id){try{const d=await api('x/report/'+id);modal(`<iframe id=rf style="width:100%;height:60vh;border:1px solid #ccc"></iframe><p><button class=b onclick="rf.contentWindow.print()">Print / Save as PDF</button> <button class=s onclick=closeM()>Close</button></p>`);$('#rf').srcdoc=d.html}catch(e){alert(e.message)}}
async function reexView(){const M=$('#main');M.innerHTML=LOAD;try{const r=(await api('x/runs')).filter(x=>['Failed','Runner Error'].includes(x.status)||x.review=='Returned');
M.innerHTML=`<h1>${labelOf('re-execution')}</h1><p>Runs that failed, errored or were returned for correction. Re-execution creates a new run; the original results stay unchanged.</p><div class=tw><table><tr><th>Run<th>Test case<th>Mode<th>Status<th>Review<th>Actions</tr>${r.map(x=>`<tr><td>${x.code}<td>${esc(x.tc)} – ${esc(x.tc_title)}<td>${x.mode}<td>${sb(x.status)}<td>${x.review?sb(x.review):''}<td><button class=s onclick="openRun(${x.id})">Compare</button>${can('execute')?`<button class=s onclick="doRun('${x.mode}',${x.tc_id},${x.id},${x.config_id||'null'},${x.project_id||'null'})">Re-execute</button>`:''}</tr>`).join('')}</table></div>${r.length?'':'<div class=empty>Nothing needs re-execution.</div>'}`}catch(e){err(e)}}
// ---------- deviations
async function devView(){const M=$('#main');M.innerHTML=LOAD;try{const r=await api('x/deviations'),nx={Open:[['Under Assessment','Start assessment']],'Under Assessment':[['Corrected','Mark corrected']],Corrected:[['Closed','Close'],['Under Assessment','Reopen']]};
M.innerHTML=`<h1>${labelOf('deviation-log')}${can('create')||can('execute')?'<button class=b onclick=newDev()>+ New deviation</button>':''}</h1><p><small>Failed test steps create deviations automatically.</small></p><div class=tw><table><tr><th>ID<th>Title<th>Severity<th>Run<th>Project<th>Status<th>Last note<th>Actions</tr>${r.map(x=>`<tr><td>${x.code}<td>${esc(x.title)}<td>${x.severity}<td>${x.run_code||''}<td>${esc(x.project)}<td>${sb(x.status)}<td>${esc(x.note||'')}<td>${x.run_id?`<button class=s onclick="openRun(${x.run_id})">Run</button>`:''}${(nx[x.status]||[]).map(([t,l])=>`<button class=s onclick="devSt(${x.id},'${t}')">${l}</button>`).join('')}</tr>`).join('')}</table></div>${r.length?'':'<div class=empty>No deviations.</div>'}`}catch(e){err(e)}}
const devSt=(id,to)=>act('Deviation: '+to,{comment:1,req:1},async c=>{await api(`x/deviations/${id}/status`,{method:'POST',body:{to,comment:c}});devView()});
async function newDev(){const [p,u]=await Promise.all([api('r/projects/options'),api('r/user/options')]);modal(`<h3>New deviation</h3><div class=f><label>Title *</label><input id=dt><label>Description *</label><textarea id=dd rows=4></textarea><label>Severity *</label><select id=ds><option>Critical<option selected>Major<option>Minor</select><label>Project</label><select id=dp><option value="">--</option>${p.map(x=>`<option value=${x.id}>${esc(x.label)}</option>`).join('')}</select><label>Assign to</label><select id=da><option value="">--</option>${u.map(x=>`<option value=${x.id}>${esc(x.label)}</option>`).join('')}</select></div><p id=e class=err></p><button class=b onclick=saveDev()>Save</button> <button class=s onclick=closeM()>Cancel</button>`)}
async function saveDev(){try{await api('x/deviations',{method:'POST',body:{title:$('#dt').value,description:$('#dd').value,severity:$('#ds').value,project_id:+$('#dp').value||null,assigned_to:+$('#da').value||null}});closeM();devView()}catch(e){$('#e').textContent=e.message}}
// ---------- reports
async function repView(names,i=0){const M=$('#main');M.innerHTML=LOAD;try{const d=await api('rep/'+names[i]);window._rep=d;
M.innerHTML=`<h1>${labelOf(A.cur)}<button class=s onclick="csv()">Export CSV</button></h1>${names.length>1?`<div class=tabs>${names.map((n,j)=>`<button class="${j==i?'on':''}" onclick='repView(${JSON.stringify(names)},${j})'>${n}</button>`).join('')}</div>`:''}<div class=bar><input placeholder="Search" oninput="repFilter(this.value)"></div>${d.note?`<p><b>${esc(d.note)}</b></p>`:''}<div class=tw><table id=rt><tr>${d.cols.map(c=>`<th>${esc(c)}`).join('')}</tr>${d.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}`).join('')}</tr>`).join('')}</table></div>${d.rows.length?'':'<div class=empty>No data.</div>'}`}catch(e){err(e)}}
const repFilter=q=>document.querySelectorAll('#rt tr:not(:first-child)').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q.toLowerCase()));
function csv(){const d=window._rep,t=[d.cols,...d.rows].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='report.csv';a.click()}
boot();
</script></body></html>
