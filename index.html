<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Iconics VMS</title>
<style>
:root{--header:#384D44;--menu:#62835F;--thead:#405945;--side:#DAD7CF;--sub:#A8B390;--text:#222B26;--border:#CFCBC2;--ok:#2E7D32;--warn:#B26A00;--bad:#B3261E;--info:#1565C0}
*{box-sizing:border-box}body{margin:0;font:14px "Open Sans",Segoe UI,sans-serif;color:var(--text);background:#fff}
header{height:52px;background:var(--header);color:#fff;display:flex;align-items:center;padding:0 16px;gap:12px;position:fixed;inset:0 0 auto 0;z-index:5}
header b{font-size:18px;letter-spacing:1px}header small{opacity:.8}header .sp{flex:1}header span{font-size:12px}
header button{background:none;border:1px solid #ffffff55;color:#fff;border-radius:4px;padding:4px 10px;cursor:pointer}
#app{display:flex;padding-top:52px;height:100vh}
nav{width:270px;background:var(--side);overflow:auto;flex-shrink:0}
nav .mod{background:var(--header);color:#fff;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;border-left:4px solid transparent}
nav .mod.active{background:var(--menu);border-left-color:#E8832A}
nav .it{padding:10px 14px 10px 28px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid #0000000d}
nav .it:hover{background:#cbc8bf}nav .it.sel{background:var(--sub)}nav .ch{padding-left:46px}
main{flex:1;overflow:auto;padding:20px 24px}
h1{margin:0 0 14px;font-size:26px;display:flex;justify-content:space-between;align-items:center}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.bar input,.bar select,.f input,.f textarea,.f select{padding:8px;border:1px solid var(--border);border-radius:4px;font:inherit}
.bar input{flex:1;min-width:180px}
button.b{background:var(--menu);color:#fff;border:0;border-radius:4px;padding:8px 14px;cursor:pointer}button.s{background:#eee;color:#333;border:1px solid var(--border);border-radius:4px;padding:6px 10px;cursor:pointer;margin-right:4px}
.tabs button{border:0;padding:9px 16px;cursor:pointer;background:#e8e6df}.tabs button.on{background:var(--menu);color:#fff}
table{width:100%;border-collapse:collapse}th{background:var(--thead);color:#fff;text-align:left;padding:10px;cursor:pointer}td{padding:10px;border-bottom:1px solid var(--border)}tr:nth-child(even) td{background:#f7f6f2}
.st{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}.Draft{background:#78807a}.In{background:var(--warn)}.Approved{background:var(--ok)}.Effective{background:var(--info)}.Obsolete{background:var(--bad)}
.empty,.msg{padding:30px;text-align:center;color:#666}.err{color:var(--bad)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}.modal>div{background:#fff;border-radius:6px;padding:20px;width:min(560px,94vw);max-height:90vh;overflow:auto}
.f label{display:block;margin:10px 0 4px;font-weight:600}.f input,.f textarea,.f select{width:100%}
#login{max-width:340px;margin:12vh auto;padding:24px;border:1px solid var(--border);border-radius:6px}#login input{width:100%;margin:6px 0;padding:9px}
.pg{display:flex;gap:8px;align-items:center;margin-top:12px}
@media(max-width:800px){nav{width:200px}}
</style></head><body><div id="root"></div>
<script>
const $=s=>document.querySelector(s),api=async(p,o={})=>{const r=await fetch('/api/'+p,{...o,headers:{'Content-Type':'application/json',Authorization:S.token||''},body:o.body&&JSON.stringify(o.body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Request failed');return d};
const S={token:localStorage.t,user:JSON.parse(localStorage.u||'null'),menu:[],res:localStorage.res||'dashboard',open:localStorage.open||'Administration',q:'',status:'',sort:'updated_at',desc:true,page:1,tab:'All'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function loginView(err=''){$('#root').innerHTML=`<div id=login><h2>Lab Iconics VMS</h2><input id=u placeholder=Username value=admin><input id=p type=password placeholder=Password value=Vms@123><button class=b onclick=doLogin()>Sign in</button><p class=err>${err}</p><small>Demo users: admin, author, reviewer, approver</small></div>`}
async function doLogin(){try{const d=await api('login',{method:'POST',body:{username:$('#u').value,password:$('#p').value}});S.token=d.token;S.user=d.user;localStorage.t=d.token;localStorage.u=JSON.stringify(d.user);boot()}catch(e){loginView(e.message)}}
function logout(){localStorage.clear();S.token=null;loginView()}
async function boot(){if(!S.token)return loginView();try{S.menu=await api('menu')}catch{return logout()}
$('#root').innerHTML=`<header><b>LAB ICONICS VMS</b><small>v1.0</small><div class=sp></div><span>Instance - QA1 | ${esc(S.user.name)} | ${esc(S.user.role)}</span><button onclick="go('dashboard')">Dashboard</button><button onclick=logout()>Logout</button></header><div id=app><nav id=nav></nav><main id=main></main></div>`;nav();go(S.res)}
function nav(){$('#nav').innerHTML=S.menu.map(m=>`<div class="mod ${S.open==m.module?'active':''}" onclick="tog('${m.module}')"><span>${m.module}</span><span>${S.open==m.module?'⌄':'›'}</span></div>`+(S.open==m.module?m.items.map(i=>i.children?`<div class=it onclick="this.nextSibling.hidden=!this.nextSibling.hidden"><span>${i.label}</span>›</div><div>${i.children.map(c=>`<div class="it ch ${S.res==c.res?'sel':''}" onclick="go('${c.res}')">${c.label}</div>`).join('')}</div>`:`<div class="it ${S.res==i.res?'sel':''}" onclick="go('${i.res}')">${i.label}</div>`).join(''):'')).join('')}
function tog(m){S.open=S.open==m?'':m;localStorage.open=S.open;nav()}
function go(r){S.res=r;localStorage.res=r;S.q='';S.status='';S.page=1;for(const m of S.menu)for(const i of m.items)for(const c of i.children||[i])if(c.res==r&&S.open!=m.module){S.open=m.module;localStorage.open=m.module}nav();r=='dashboard'?dash():RUNS.includes(r)?runsView():DEFS.includes(r)?defectsView():r=='audit-trail'||r=='audit-reports'?auditView():list()}
const title=r=>{for(const m of S.menu)for(const i of m.items)for(const c of i.children||[i])if(c.res==r)return c.label;return'Dashboard'};
async function dash(){const M=$('#main');M.innerHTML='<div class=msg>Loading…</div>';try{const a=await api('approvals'),rv=a.filter(x=>(x.comment||'').startsWith('Reverted'));const rows=S.tab=='All'?a:rv;
M.innerHTML=`<h1>Dashboard</h1><div style="background:#e8e6df;padding:12px;font-weight:700">APPROVAL TRANSACTIONS</div><div class=tabs><button class="${S.tab=='All'?'on':''}" onclick="S.tab='All';dash()">All ${a.length}</button><button class="${S.tab=='Reverted'?'on':''}" onclick="S.tab='Reverted';dash()">Reverted ${rv.length}</button></div><table><tr><th>Menu Name<th>Name/ID<th>Action By<th>Action On<th>Approval Status</tr>${rows.map(r=>`<tr style=cursor:pointer onclick="go('${r.res}')"><td>${esc(r.menu)}<td>${esc(r.code)} – ${esc(r.title)}<td>${esc(r.created_by)}<td>${r.updated_at}<td><span class="st ${r.status}">${r.status}</span></tr>`).join('')}</table>${rows.length?'':'<div class=empty>No pending approval transactions.</div>'}`}catch(e){M.innerHTML=`<div class="msg err">${e.message}</div>`}}
async function list(){const M=$('#main');M.innerHTML='<div class=msg>Loading…</div>';try{const d=await api(`${S.res}?q=${encodeURIComponent(S.q)}&status=${S.status}&sort=${S.sort}&desc=${S.desc}&page=${S.page}`);S.d=d;const n=Math.ceil(d.total/10)||1;
M.innerHTML=`<h1>${title(S.res)}<button class=b onclick="form()">+ New</button></h1><div class=bar><input id=q placeholder="Enter Search Param" value="${esc(S.q)}" onkeydown="if(event.key=='Enter'){S.q=this.value;S.page=1;list()}"><select onchange="S.status=this.value;S.page=1;list()">${['','Draft','In Review','Approved','Effective','Obsolete'].map(s=>`<option ${S.status==s?'selected':''} value="${s}">${s||'All statuses'}</option>`).join('')}</select><button class=s onclick="S.desc=!S.desc;list()">${S.desc?'Z-A':'A-Z'}</button><button class=s onclick="S.q='';S.status='';list()">Reset</button></div>
<table><tr>${[['code','ID'],['title','Title'],['status','Status'],['created_by','Created By'],['updated_at','Updated']].map(([k,l])=>`<th onclick="S.sort='${k}';S.desc=!S.desc;list()">${l}${S.sort==k?(S.desc?' ▾':' ▴'):''}`).join('')}<th>Actions</tr>${d.items.map(r=>`<tr><td>${r.code}<td>${esc(r.title)}<td><span class="st ${r.status}">${r.status}</span><td>${r.created_by}<td>${r.updated_at}<td>${acts(r)}</tr>`).join('')}</table>${d.items.length?'':'<div class=empty>No records found.</div>'}<div class=pg><button class=s ${S.page<2?'disabled':''} onclick="S.page--;list()">Prev</button>Page ${S.page} of ${n} (${d.total})<button class=s ${S.page>=n?'disabled':''} onclick="S.page++;list()">Next</button></div>`}catch(e){M.innerHTML=`<div class="msg err">${e.message}</div>`}}
const NEXT={Draft:[['In Review','Submit']],'In Review':[['Approved','Approve'],['Draft','Revert']],Approved:[['Effective','Make Effective']],Effective:[['Obsolete','Obsolete']]};
const acts=r=>`<button class=s onclick="hist(${r.id})">History</button>`+(r.status=='Draft'?`<button class=s onclick="form(${r.id})">Edit</button>`:'')+(NEXT[r.status]||[]).map(([t,l])=>`<button class=s onclick="trans(${r.id},'${t}')">${l}</button>`).join('');
async function trans(id,to){let password='',comment='';if(to=='Draft'){comment=prompt('Reason for revert:');if(!comment)return}if(['Approved','Effective','Obsolete'].includes(to)){password=prompt('E-signature: re-enter your password to sign');if(!password)return}
try{await api(`${S.res}/${id}/transition`,{method:'POST',body:{to,password,comment}});list()}catch(e){alert(e.message)}}
async function form(id){let r=id?S.d.items.find(x=>x.id==id):{title:'',description:'',link_id:null},opts='';
if(S.d.parent){const p=await api(`${S.d.parent}?size=100`);opts=`<label>Linked ${title(S.d.parent)} (Approved/Effective)</label><select id=l><option value="">-- select --</option>${p.items.filter(x=>['Approved','Effective'].includes(x.status)).map(x=>`<option value=${x.id} ${x.id==r.link_id?'selected':''}>${x.code} – ${esc(x.title)}</option>`).join('')}</select>`}
modal(`<h3>${id?'Edit':'New'} ${title(S.res)}</h3><div class=f><label>Title *</label><input id=t value="${esc(r.title)}"><label>${TC.includes(S.res)?'Steps: one per line as Instruction | Expected result (start with [E] if evidence is required)':'Description'}</label><textarea id=d rows=4>${esc(r.description)}</textarea>${opts}</div><p id=e class=err></p><button class=b onclick="save(${id||0})">Save</button> <button class=s onclick=closeM()>Cancel</button>`)}
async function save(id){try{const body={title:$('#t').value,description:$('#d').value,link_id:$('#l')&&$('#l').value?+$('#l').value:null};await api(id?`${S.res}/${id}`:S.res,{method:id?'PUT':'POST',body});closeM();list()}catch(e){$('#e').textContent=e.message}}
async function hist(id){const h=await api(`${S.res}/${id}/history`);modal(`<h3>Record history</h3><table><tr><th>Time<th>User<th>Action<th>Detail</tr>${h.audit.map(a=>`<tr><td>${a.ts}<td>${a.user}<td>${a.action}<td>${esc(a.detail)}</tr>`).join('')}</table><h4>Electronic signatures</h4>${h.signatures.map(s=>`<p>${s.user} – ${s.meaning} – ${s.ts}<br><small>hash ${s.rec_hash.slice(0,16)}…</small></p>`).join('')||'<p class=empty>None yet</p>'}<button class=s onclick=closeM()>Close</button>`)}
async function auditView(){const [a,v]=await Promise.all([api('audit'),api('audit/verify')]);$('#main').innerHTML=`<h1>${title(S.res)}</h1><p>Hash chain: <b style="color:${v.valid?'var(--ok)':'var(--bad)'}">${v.valid?'VERIFIED':'BROKEN at #'+v.broken_at}</b></p><table><tr><th>Time<th>User<th>Action<th>Menu<th>Detail<th>Hash</tr>${a.map(x=>`<tr><td>${x.ts}<td>${x.user}<td>${x.action}<td>${x.res}<td>${esc(x.detail)}<td><small>${x.hash.slice(0,12)}</small></tr>`).join('')}</table>`}
const modal=h=>{closeM();const m=document.createElement('div');m.className='modal';m.id='m';m.innerHTML='<div>'+h+'</div>';document.body.appendChild(m)},closeM=()=>$('#m')?.remove();

const TC=['test-case-library','test-case-preparation'],RUNS=['manual-execution','execution-monitoring','results-evidence','execution-review','oq-execution-report','validation-summary-report','test-results-deviation-report'],DEFS=['defect-registration','defect-classification-assignment','investigation-resolution','retest-verification','defect-closure','defect-reports'];
const MAP={'In Progress':'In',Passed:'Approved',Failed:'Obsolete',Pass:'Approved',Fail:'Obsolete',Blocked:'Obsolete','Not Applicable':'Draft',Open:'Obsolete',Investigating:'In',Resolved:'Effective',Closed:'Approved'},sb=t=>`<span class="st ${MAP[t]||'Draft'}">${t||'Pending'}</span>`;
async function runsView(){const M=$('#main');M.innerHTML='<div class=msg>Loading…</div>';try{const r=await api('x/runs');M.innerHTML=`<h1>${title(S.res)}<button class=b onclick=newRun()>+ Start run</button></h1><table><tr><th>Run<th>Test case<th>Executor<th>Status<th>Started<th>Retest of<th>Actions</tr>${r.map(x=>`<tr><td>${x.code}<td>${x.tc} – ${esc(x.tc_title)}<td>${x.executor}<td>${sb(x.status)}<td>${x.started}<td>${x.retest_of||''}<td><button class=s onclick="openRun(${x.id})">Open</button><button class=s onclick="showReport(${x.id})">Report</button></tr>`).join('')}</table>${r.length?'':'<div class=empty>No runs yet. Approve a test case, then click Start run.</div>'}`}catch(e){$('#main').innerHTML=`<div class="msg err">${e.message}</div>`}}
async function newRun(){try{const L=await Promise.all(TC.flatMap(t=>['Approved','Effective'].map(s=>api(`${t}?status=${s}&size=100`))));const it=L.flatMap(x=>x.items);modal(`<h3>Start run</h3><div class=f><label>Approved test case</label><select id=tc>${it.map(x=>`<option value=${x.id}>${x.code} – ${esc(x.title)}</option>`).join('')}</select></div><p id=e class=err>${it.length?'':'No approved test cases. Create one in Test Case Library, submit it and get it approved.'}</p><button class=b onclick="doRun()">Start</button> <button class=s onclick=closeM()>Cancel</button>`)}catch(e){alert(e.message)}}
async function doRun(rec,ret){try{const d=await api('x/runs',{method:'POST',body:{rec_id:+(rec||$('#tc').value),retest_of:ret||null}});closeM();openRun(d.id)}catch(e){$('#e')?$('#e').textContent=e.message:alert(e.message)}}
async function openRun(id){const M=$('#main');try{const d=await api('x/runs/'+id),r=d.run,ip=r.status=='In Progress';M.innerHTML=`<h1>${r.code} ${sb(r.status)}<button class=s onclick="go(S.res)">Back</button></h1><p>${r.tc} – ${esc(r.tc_title)} | Executor: ${r.executor}${r.retest_of?' | Retest of run '+r.retest_of:''}</p><table><tr><th>#<th>Instruction<th>Expected<th>Result / Actual</tr>${d.steps.map(s=>`<tr><td>${s.n}<td>${esc(s.instruction)}${s.ev_req?' <b>[E]</b>':''}<td>${esc(s.expected)}<td>${s.result?`${sb(s.result)}<br>${esc(s.actual)}<br><i>${esc(s.comment)}</i>${s.ev_file?`<br><a href=# onclick="dl(${s.id},'${esc(s.ev_name)}');return false">📎 ${esc(s.ev_name)}</a>`:''}<br><small>${s.done_by} ${s.ts}</small>`:ip?`<select id=r${s.id}><option>Pass<option>Fail<option>Blocked<option>Not Applicable</select><br><textarea id=a${s.id} rows=2 placeholder="Actual result" style="width:100%"></textarea><input id=c${s.id} placeholder="Comment / justification" style="width:100%"><input type=file id=f${s.id}><br><button class=s onclick="recStep(${s.id},${id})">Save step</button>`:'Not executed'}</tr>`).join('')}</table>${d.defects.length?`<h3>Defects</h3>${d.defects.map(x=>`<p>${x.code} ${sb(x.status)} ${esc(x.title)}</p>`).join('')}`:''}${ip?`<button class=b onclick="finish(${id})">Complete run</button> `:''}<button class=s onclick="showReport(${id})">Report</button><p id=e class=err></p>`}catch(e){M.innerHTML=`<div class="msg err">${e.message}</div>`}}
async function recStep(sid,rid){const f=$('#f'+sid).files[0];let b64='';if(f){if(f.size>5e6)return alert('File larger than 5 MB');b64=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)})}
try{await api(`x/steps/${sid}/result`,{method:'POST',body:{result:$('#r'+sid).value,actual:$('#a'+sid).value,comment:$('#c'+sid).value,file_name:f?f.name:'',file_b64:b64}});openRun(rid)}catch(e){alert(e.message)}}
async function finish(id){try{await api(`x/runs/${id}/complete`,{method:'POST'});openRun(id)}catch(e){alert(e.message)}}
async function dl(sid,n){const r=await fetch('/api/x/evidence/'+sid,{headers:{Authorization:S.token}});if(!r.ok)return alert('Download failed');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=n;a.click()}
async function showReport(id){try{const d=await api('x/report/'+id);modal(`<iframe id=rf style="width:100%;height:60vh;border:1px solid #ccc"></iframe><p><button class=b onclick="rf.contentWindow.print()">Print / Save as PDF</button> <button class=s onclick=closeM()>Close</button></p>`);$('#rf').srcdoc=d.html}catch(e){alert(e.message)}}
async function defectsView(){const M=$('#main');M.innerHTML='<div class=msg>Loading…</div>';try{const r=await api('x/defects'),nx={Open:[['Investigating','Start investigation']],Investigating:[['Resolved','Mark resolved']],Resolved:[['Closed','Close'],['Investigating','Reopen']]};M.innerHTML=`<h1>${title(S.res)}</h1><p><small>Defects are created automatically when a test step fails.</small></p><table><tr><th>ID<th>Run<th>Title<th>Status<th>Last note<th>Actions</tr>${r.map(x=>`<tr><td>${x.code}<td>${x.run_code}<td>${esc(x.title)}<td>${sb(x.status)}<td>${esc(x.note||'')}<td><button class=s onclick="openRun(${x.run_id})">Run</button>${x.status=='Resolved'?`<button class=s onclick="doRun(${x.rec_id},${x.run_id})">Retest</button>`:''}${(nx[x.status]||[]).map(([t,l])=>`<button class=s onclick="dtr(${x.id},'${t}')">${l}</button>`).join('')}</tr>`).join('')}</table>${r.length?'':'<div class=empty>No defects.</div>'}`}catch(e){M.innerHTML=`<div class="msg err">${e.message}</div>`}}
async function dtr(id,to){const c=prompt('Comment (required):');if(!c)return;try{await api(`x/defects/${id}/transition`,{method:'POST',body:{to,comment:c}});defectsView()}catch(e){alert(e.message)}}
boot();
</script></body></html>
